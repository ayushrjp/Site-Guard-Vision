# Render Blueprint for SiteGuardVision.
#
# Shape notes (see reports/RENDER_DEPLOYMENT_READINESS.md for the full
# rationale):
#   * ONE instance / ONE Gunicorn worker: the video queue is in-process and
#     SQLite is the system of record. Horizontal scaling would split both.
#   * A persistent disk is REQUIRED for the SQLite database, uploads,
#     annotated outputs, thumbnails and the Chroma index. Render's default
#     filesystem is ephemeral and is wiped on every deploy/restart.
#   * Persistent disks are only available on paid compute plans and prevent
#     zero-downtime deploys (Render stops the old instance before starting the
#     new one). This is expected and acceptable for this application.
#
# Costs checked against https://render.com/pricing (18 Nov 2026):
#   1c-2g compute (1 CPU / 2 GB RAM) .... $25.00 / month
#   persistent disk 10 GB @ $0.25/GB ..... $2.50 / month
#   Hobby workspace ...................... $0
# Approx. total: $27.50 / month (prorated to the second while running).
# The free / 0.5c-512mb plans are NOT sufficient (no disk support and too
# little RAM for PyTorch + Ultralytics + ChromaDB).

services:
  - type: web
    name: siteguardvision
    runtime: python
    plan: 1c-2g
    region: oregon
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /health
    # Install CPU-only PyTorch first: the default PyPI wheel pulls multi-GB
    # CUDA libraries that Render cannot use. No GPU is available on Render.
    buildCommand: >-
      pip install --upgrade pip &&
      pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu &&
      pip install -r requirements.txt
    startCommand: gunicorn --config gunicorn.conf.py server:app
    disk:
      name: siteguard-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: SITEGUARD_BEHIND_PROXY
        value: "1"
      - key: SITEGUARD_LOG_LEVEL
        value: INFO
      - key: WEB_CONCURRENCY
        value: "1"
      - key: SITEGUARD_GUNICORN_THREADS
        value: "8"

      # --- Writable state on the persistent disk -------------------------
      - key: SITEGUARD_DATA_DIR
        value: /var/data
      - key: SITEGUARD_DB_PATH
        value: /var/data/siteguard.db
      - key: SITEGUARD_IMAGE_UPLOAD_DIR
        value: /var/data/image_uploads
      - key: SITEGUARD_RENDERED_DIR
        value: /var/data/rendered
      - key: SITEGUARD_VIDEO_UPLOAD_DIR
        value: /var/data/video_uploads
      - key: SITEGUARD_VIDEO_OUTPUT_DIR
        value: /var/data/video_outputs
      - key: SITEGUARD_VIDEO_THUMB_DIR
        value: /var/data/video_thumbnails
      - key: SITEGUARD_VECTOR_DB
        value: /var/data/vector_db
      - key: SITEGUARD_KNOWLEDGE_BASE
        value: /var/data/knowledge_base

      # --- Safety Assistant ---------------------------------------------
      # Required. Point at a reachable Ollama-compatible endpoint (see
      # README). Left unset in the Blueprint so the value is never committed;
      # Render prompts for it on first deploy.
      - key: OLLAMA_BASE_URL
        sync: false
      - key: OLLAMA_CHAT_MODEL
        value: qwen2.5:3b
      - key: OLLAMA_EMBED_MODEL
        value: nomic-embed-text
      - key: OLLAMA_TIMEOUT
        value: "300"
